<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#0b0b0f;--card:#15131b;--card2:#1b1824;--line:#241f2e;--muted:#9a93a8;
  --tx:#f4f1f8;--ac:#c026d3;--ac2:#7c3aed;--ok:#2ecc71;--lock:#0f0d15;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 0 96px}
img{display:block}
a{color:inherit}
.btn{display:block;width:100%;text-align:center;padding:15px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 8px 28px rgba(124,58,237,.35)}
.btn.sec{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.muted{color:var(--muted)}

/* +18 gate */
#gate{position:fixed;inset:0;z-index:9999;background:rgba(8,6,12,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#gate h1{font-size:22px;margin:0 0 6px}
#gate p{color:var(--muted);max-width:340px;margin:0 0 22px;line-height:1.5}
#gate .row{display:flex;gap:10px;max-width:340px;width:100%}
#gate .btn{flex:1}

/* hero */
.hero{position:relative}
.cover{width:100%;aspect-ratio:3/1.35;object-fit:cover;background:var(--card)}
.cover-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,0) 40%,rgba(11,11,15,.85))}
.live{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.plus18{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}
.counts{position:absolute;right:12px;bottom:12px;display:flex;gap:14px;font-size:13px}
.counts b{font-weight:800}
.counts span{color:#e9e5f0}

.head{padding:0 16px;margin-top:-34px;position:relative}
.avatar{width:84px;height:84px;border-radius:50%;border:3px solid var(--bg);object-fit:cover;background:var(--card)}
.name{display:flex;align-items:center;gap:7px;margin-top:8px}
.name h1{font-size:22px;margin:0}
.verif{color:#36a1ff;font-size:18px}
.handle{color:var(--muted);font-size:14px;margin-top:2px}
.hook{margin:12px 0 0;line-height:1.5;font-size:15px}

.sect{padding:18px 16px 0}
.sect h2{font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* plans */
.plan{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.plan:hover,.plan.best{border-color:var(--ac)}
.plan .l{display:flex;flex-direction:column}
.plan .t{font-weight:700}
.plan .s{color:var(--muted);font-size:13px;margin-top:2px}
.plan .off{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;color:#ffd0f6;background:rgba(192,38,211,.18);padding:2px 8px;border-radius:999px;vertical-align:middle}
.plan .p{font-weight:800;font-size:18px;white-space:nowrap}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0}
.actions .btn{font-size:15px;padding:13px}

/* tabs + feed */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 16px 0}
.tab{flex:1;text-align:center;padding:12px 0;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 16px 0}
.cell{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card)}
.cell img{width:100%;height:100%;object-fit:cover}
.cell.lock img{filter:blur(18px) brightness(.5);transform:scale(1.1)}
.cell .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff}
.cell .lk .ic{font-size:22px}
.cell .lk .pr{font-size:12px;font-weight:800;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:999px}
.cell .vid{position:absolute;top:7px;right:7px;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

/* sticky */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(11,11,15,0),rgba(11,11,15,.97) 30%);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:0 auto}
.bar .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.state{text-align:center;padding:70px 20px;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--ac);margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>

  var CTX=null, pollT=null, SHEET=null;
  function injectSheetCss(){
    if(document.getElementById('sheetcss')) return;
    var s=document.createElement('style'); s.id='sheetcss';

      '#sheet{position:fixed;inset:0;z-index:9998;display:none;align-items:flex-end;justify-content:center;background:rgba(5,4,8,.72)}'+

      '#sheet .card{width:100%;max-width:520px;background:var(--card2);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}'+

    var d=document.createElement('div'); d.id='sheet';

        '<h3 id="sh-title">Assinar</h3>'+
        '<p class="sub" id="sh-sub"></p>'+

          '<div class="err" id="err-auth"></div>'+
          '<button class="btn" id="btn-auth">Continuar</button>'+

  async function goSub(m,plan){

      if(pollT) clearInterval(pollT);
      pollT=setInterval(function(){ checkActive(false); }, 5000);
    }catch(e){ setErr('err-det','Erro de conexão. Tente de novo.'); b.textContent='Gerar Pix'; b.disabled=false; }
  }

  async function checkActive(manual){
    try{
      var tok=await sessionToken(); if(!tok) return;
      var r=await fetch(FN+'sub_check',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify({creator_key:CTX.key})});
      var j=await r.json().catch(function(){return{};});
      if(j.active){ if(pollT){clearInterval(pollT);pollT=null;} showPane('ok'); }
      else if(manual){ var s=SHEET.querySelector('#pix-status'); if(s) s.textContent='Ainda não identifiquei o pagamento. Se já pagou, aguarde alguns segundos e toque de novo.'; }
    }catch(e){}
  }

  async function fetchFeed(creatorKey){
    try{
      var tok=await sessionToken();
      var h={'Content-Type':'application/json','apikey':SB_KEY};
      if(tok) h['Authorization']='Bearer '+tok;
      var r=await fetch(FN+'feed',{method:'POST',headers:h,body:JSON.stringify({creator_key:creatorKey})});
      return await r.json();
    }catch(e){ return null; }
  }
  // carrega do Supabase; paywall server-side via feed(); fallback demo
  function load(){
    var handle=(qs("u")||qs("m")||"").replace(/^@/,"").trim();
    if(!sb || !handle){ render(DEMO); return; }
    sb.from("creators").select("*").or("handle.eq.@"+handle+",handle.eq."+handle+",key.eq."+handle).limit(1)
      .then(async function(r){
        var c=r && r.data && r.data[0];
        if(!c){ render(DEMO); return; }
        var base="https://mfxyavlpbofcdiylnnjm.supabase.co/storage/v1/object/public/avatars/";
        var plansR, fd;
        try{ plansR=await sb.from("plans").select("*").eq("creator_key",c.key).eq("active",true).order("months",{ascending:true}); }catch(e){ plansR=null; }
        try{ fd=await fetchFeed(c.key); }catch(e){ fd=null; }
        var plans=(plansR && plansR.data)||[];
        var fdPosts=(fd && fd.posts)||null;
        var counts=(fd && fd.counts)||{};
        render({
          key:c.key, handle:(c.handle||handle).replace(/^@/,""), display_name:c.display_name, verified:true, online:c.online,
          hook:c.hook||"", avatar:base+(c.avatar_path||""), cover:base+(c.cover_path||c.avatar_path||""),
          photos:(counts.photos!=null?counts.photos:"—"), videos:(counts.videos!=null?counts.videos:"—"), likes:"—",
          plans:plans.length?plans.map(function(p){return {months:p.months,price_cents:p.price_cents,label:p.label||((p.months)+" mês"+(p.months>1?"es":"")),off:(p.months>1?"":"")};}):DEMO.plans,
          posts:fdPosts?fdPosts.map(function(p){return {id:p.id,locked:p.locked,is_free:!p.locked,price_cents:p.price_cents,media_type:p.media_type,media:p.url||""};}):DEMO.posts
        });
      }).catch(function(){ render(DEMO); });
  }
  load();
})();
</script>
