  '<p><b>4.7. Contenido explícito y de desnudez.</b> La MODELO autoriza expresamente a la AGENCIA a comercializar todas las imágenes explícitas y videos de desnudez que ella produzca y consienta en poner a disposición, para su venta en las Plataformas (OnlyFans, packs, PPV, contenidos personalizados y similares), correspondiendo a la MODELO la comisión de la Cláusula 7ª (50% del Ingreso Neto). El consentimiento se da respecto de cada conjunto de material entregado para venta, presumiéndose la autorización por la propia entrega. Una vez puesto a disposición, el derecho de la AGENCIA de comercializar ese material es irrevocable y por plazo indeterminado, inclusive tras la finalización. Todo el material es de persona mayor de 18 años y producido de forma consensuada.</p>'+

  '<h2>Cláusula 5ª — Plazo y Obligaciones de la Agencia</h2>'+

  '<p><b>10.5. Ley y jurisdicción.</b> Este contrato se rige e interpreta conforme a la ley aplicable al domicilio de la AGENCIA, y las Partes se someten a la jurisdicción competente de dicho domicilio, con renuncia a cualquier otro fuero.</p>'+

  '<p><b>11.3. Fuerza mayor.</b> Ninguna Parte responde por retraso o falla causada por eventos fuera de su control razonable, siempre que comunique a la otra con prontitud y retome tan pronto sea posible.</p>'+

  '<h2>Cláusula 12ª — Sin Garantía de Resultado</h2>'+

  '<h2>Cláusula 13ª — Registros, Auditoría y Verificación</h2>'+

// signature pad
var sigCtx,sigHas=false,sigCanvas;
function setupSignature(){
  sigCanvas=document.getElementById("sig");
  var box=document.getElementById("sigbox");
  var ratio=window.devicePixelRatio||1;
  var w=box.clientWidth, h=180;
  sigCanvas.width=w*ratio; sigCanvas.height=h*ratio;
  sigCtx=sigCanvas.getContext("2d"); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1a1726";
  var drawing=false,last=null;
  function pos(e){var r=sigCanvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};}
  function start(e){e.preventDefault();drawing=true;last=pos(e);document.getElementById("sigph").style.display="none";}
  function move(e){if(!drawing)return;e.preventDefault();var p=pos(e);sigCtx.beginPath();sigCtx.moveTo(last.x,last.y);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();last=p;sigHas=true;}
  function end(e){drawing=false;}
  sigCanvas.addEventListener("mousedown",start);sigCanvas.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  sigCanvas.addEventListener("touchstart",start,{passive:false});sigCanvas.addEventListener("touchmove",move,{passive:false});sigCanvas.addEventListener("touchend",end);
  document.getElementById("sigclr").onclick=function(){sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigHas=false;document.getElementById("sigph").style.display="grid";};
}

function val(id){var e=document.getElementById(id);return e?(e.value||"").trim():"";}
function chk(id){var e=document.getElementById(id);return !!(e&&e.checked);}

  if(val("f-signname").length<3) return err(ES?"Escribe tu nombre completo en la firma.":"Digite seu nome completo na assinatura.");
  var fields={
    nome_completo:val("f-nome"),nome_artistico:val("f-art"),nascimento:val("f-nasc"),
    nacionalidade:val("f-nac"),estado_civil:val("f-ec"),rg:val("f-rg"),cpf:val("f-cpf"),

    limites:{rosto:chk("l-rosto"),localizacao:chk("l-local"),outras_pessoas:chk("l-outros"),chamadas_video:chk("l-video"),outros:val("l-txt")}
  };
  var png="";try{png=sigCanvas.toDataURL("image/png");}catch(e){}
  var consent={read:chk("c-read"),agree:chk("c-agree"),adult:chk("c-adult")};
  var btn=document.getElementById("submit");btn.disabled=true;btn.textContent=ES?"Enviando…":"Enviando…";msg.innerHTML="";
  api("sign",{fields:fields,consent:consent,signed_name:val("f-signname"),signature_png:png}).then(function(r){
    if(r&&r.ok){ showState("✅",ES?"¡Contrato firmado!":"Contrato assinado!",ES?"Listo 💜 tu contrato fue enviado firmado a Vezclub. Puedes cerrar esta página.":"Pronto 💜 seu contrato foi enviado assinado para a Vezclub. Você pode fechar esta página."); return; }

    if(r&&r.error==="missing_signature") return err(ES?"Haz tu firma en el recuadro.":"Faça sua assinatura no quadro.");
    err(ES?"No pude enviar. Intenta de nuevo.":"Não consegui enviar. Tente de novo.");
  });
}
