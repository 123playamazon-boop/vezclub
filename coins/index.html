<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vezclub — Coins</title>
<style>
:root{--bg:#0b0b0f;--card:#15131b;--card2:#1b1824;--line:#241f2e;--muted:#9a93a8;--tx:#f4f1f8;--ac:#1b74e8;--ac2:#1552b8;--gold:#ffd24a;--ok:#2ecc71}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.bal{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800}
.bal .c{color:var(--gold)}
.back{color:var(--muted);text-decoration:none;font-size:22px}
h2{font-size:18px;margin:4px 0 2px}
.muted{color:var(--muted)}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pack{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;transition:.15s}
.pack.on,.pack:hover{border-color:var(--ac)}
.pack .co{font-size:24px;font-weight:900;color:var(--gold)}
.pack .co small{color:var(--muted);font-weight:700;font-size:12px}
.pack .pr{margin-top:6px;font-weight:800}
.pack .bo{margin-top:4px;font-size:11px;color:#9effc0}
.seg{display:flex;gap:6px;background:#0e0c14;border:1px solid var(--line);border-radius:12px;padding:5px;margin:8px 0 14px}
.seg button{flex:1;padding:11px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.btn{display:block;width:100%;text-align:center;padding:15px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 8px 24px rgba(124,58,237,.3)}
.btn:disabled{opacity:.55}
.pixbox{background:#0e0c14;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;word-break:break-all;font-size:12px;color:#d8d2e6;max-height:120px;overflow:auto}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.state{text-align:center;padding:16px;color:var(--muted)}
.ok{text-align:center;padding:30px 10px}.ok .big{font-size:46px}
.hide{display:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:var(--ac);margin:8px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="back" href="/">‹</a>
    <div class="bal">🪙 <span class="c" id="bal">—</span> coins</div>
  </div>

  <div id="buy">
    <h2>Comprar coins</h2>
    <p class="muted" style="margin-top:2px;font-size:13px">Use seus coins em chamadas de vídeo, packs e gorjetas.</p>
    <div class="packs" id="packs"></div>
    <div class="seg" id="method">
      <button data-m="pix" class="on">Pix</button>
      <button data-m="card">Cartão</button>
    </div>
    <button class="btn" id="go">Comprar</button>
    <div id="pix-area" class="hide">
      <div class="note" id="pix-amt"></div>
      <div class="pixbox" id="pix-code"></div>
      <button class="btn" id="copy" style="margin-top:10px">Copiar código Pix</button>
      <div class="state" id="pix-wait"><div class="spin"></div>Aguardando o pagamento…</div>
    </div>
    <p class="note" id="err" style="color:#ff7a90"></p>
  </div>

  <div id="done" class="hide">
    <div class="ok"><div class="big">🪙</div><h2>Coins creditados!</h2><p class="muted">Saldo: <b id="done-bal">—</b> coins</p></div>
    <button class="btn" id="continue">Continuar</button>
  </div>

  <div id="login" class="hide state">Entre primeiro. <a href="/" style="color:var(--ac)">Início</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SB_URL="https://mfxyavlpbofcdiylnnjm.supabase.co";
  var SB_KEY="sb_publishable_RZdvipvnj0yWXAzNcpSIVg_1axK7wmj";
  var FN=SB_URL+"/functions/v1/";
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  var $=function(id){return document.getElementById(id);};
  function qs(k){try{return new URL(location.href).searchParams.get(k)||"";}catch(e){return"";}}
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  var BACK=qs('back')||'/';
  $('back').href=BACK; $('continue').onclick=function(){ location.href=BACK; };

  var PACKS=[
    {code:'br_start', coins:100, price:'R$ 9,90', bonus:'+20 bônus'},
    {code:'br_220', coins:220, price:'R$ 39,90', bonus:'+20 bônus'},
    {code:'br_600', coins:600, price:'R$ 97,00', bonus:'+100 bônus'},
    {code:'br_1300', coins:1300, price:'R$ 197,00', bonus:'+300 bônus'}
  ];
  var sel='br_220', method='pix';
  $('packs').innerHTML=PACKS.map(function(p){ return '<div class="pack'+(p.code===sel?' on':'')+'" data-code="'+p.code+'"><div class="co">'+p.coins+' <small>coins</small></div><div class="bo">'+p.bonus+'</div><div class="pr">'+p.price+'</div></div>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.pack'),function(el){ el.onclick=function(){ sel=el.getAttribute('data-code'); Array.prototype.forEach.call(document.querySelectorAll('.pack'),function(x){x.classList.remove('on');}); el.classList.add('on'); }; });
  Array.prototype.forEach.call($('method').children,function(b){ b.onclick=function(){ method=b.getAttribute('data-m'); Array.prototype.forEach.call($('method').children,function(x){x.classList.remove('on');}); b.classList.add('on'); }; });

  async function token(){ try{ var r=await sb.auth.getSession(); return r.data.session?r.data.session.access_token:null; }catch(e){ return null; } }
  async function fn(name, body){ var tok=await token(); var r=await fetch(FN+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify(body||{})}); return await r.json().catch(function(){return{error:'net'};}); }
  async function loadBal(){ try{ var u=(await sb.auth.getUser()).data.user; if(!u) return; var w=await sb.from('wallets').select('coin_balance').eq('user_id',u.id).maybeSingle(); if(w.data) $('bal').textContent=w.data.coin_balance; else $('bal').textContent='0'; }catch(e){} }
  function copyText(t){ try{navigator.clipboard.writeText(t);}catch(e){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();} }

  var pixPoll=null;
  $('go').onclick=async function(){
    $('err').textContent=''; var b=this; b.disabled=true; b.textContent='Processando…';
    try{
      if(method==='card'){
        var r=await fn('coins_stripe',{pack_code:sel});
        if(r.url){ location.href=r.url; return; }
        $('err').textContent='Não consegui abrir o cartão. Tente o Pix.'; b.disabled=false; b.textContent='Comprar'; return;
      }
      var r=await fn('coins_pix',{pack_code:sel});
      if(!r.pix_code){ $('err').textContent='Não consegui gerar o Pix. Tente de novo.'; b.disabled=false; b.textContent='Comprar'; return; }
      b.classList.add('hide'); $('packs').classList.add('hide'); $('method').classList.add('hide');
      $('pix-area').classList.remove('hide');
      $('pix-amt').textContent='R$ '+(r.amount||0).toFixed(2).replace('.',',')+' · '+(r.coins||'')+' coins';
      $('pix-code').textContent=r.pix_code;
      $('copy').onclick=function(){ copyText(r.pix_code); this.textContent='Copiado ✓'; var s=this; setTimeout(function(){s.textContent='Copiar código Pix';},1500); };
      if(pixPoll) clearInterval(pixPoll);
      pixPoll=setInterval(async function(){ var st=await fn('coins_status',{identifier:r.identifier}); if(st.status==='completed'){ clearInterval(pixPoll); success(st.balance); } }, 4000);
    }catch(e){ $('err').textContent='Erro. Tente de novo.'; b.disabled=false; b.textContent='Comprar'; }
  };

  function success(bal){ $('buy').classList.add('hide'); $('done').classList.remove('hide'); if(bal!=null) $('done-bal').textContent=bal; loadBal().then(function(){ var b=$('bal').textContent; if(b&&b!=='—') $('done-bal').textContent=b; }); }

  async function boot(){
    var tok=await token();
    if(!tok){ $('buy').classList.add('hide'); $('login').classList.remove('hide'); return; }
    loadBal();
    if(qs('coins_paid')==='1' && qs('session_id')){ var st=await fn('coins_stripe_confirm',{session_id:qs('session_id')}); if(st.status==='completed'){ success(st.balance); } }
  }
  boot();
})();
</script>
<script>
(function(){
  try{
    if(new URL(location.href).searchParams.get("embed")!=="1") return;
    function closeParent(){ try{ if(window.parent && window.parent!==window && window.parent.__vezClosePanel){ window.parent.__vezClosePanel(); return true; } }catch(e){} return false; }
    document.addEventListener("click",function(e){
      var el=e.target.closest && e.target.closest("a,button"); if(!el) return;
      var href=el.getAttribute && el.getAttribute("href");
      var txt=(el.textContent||"").trim().toLowerCase();
      var isExit=(href && (href==="/" || href.indexOf("/m/")===0)) || txt==="voltar" || txt==="in\u00edcio" || txt==="inicio" || txt==="fechar" || txt==="sair";
      if(isExit){ if(closeParent()){ e.preventDefault(); e.stopPropagation(); } }
    }, true);
  }catch(e){}
})();
</script>
</body>
</html>
