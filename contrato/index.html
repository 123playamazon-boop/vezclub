  api("get",{}).then(function(d){
    if(!d||d.error==="not_found"){ return showState("🔎","Contrato não encontrado","Peça um novo link para a Vezclub."); }
    if(d.error){ return showState("⚠️","Erro","Não consegui carregar. Recarregue a página."); }

    if(d.status==="void"){ return showState("🚫","Contrato cancelado","Este contrato foi cancelado. Peça um novo para a Vezclub."); }
    renderForm(d);
  });
}

// signature pad
var sigCtx,sigHas=false,sigCanvas;
function setupSignature(){
  sigCanvas=document.getElementById("sig");
  var box=document.getElementById("sigbox");
  var ratio=window.devicePixelRatio||1;
  var w=box.clientWidth, h=180;
  sigCanvas.width=w*ratio; sigCanvas.height=h*ratio;
  sigCtx=sigCanvas.getContext("2d"); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1a1726";
  var drawing=false,last=null;
  function pos(e){var r=sigCanvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};}
  function start(e){e.preventDefault();drawing=true;last=pos(e);document.getElementById("sigph").style.display="none";}
  function move(e){if(!drawing)return;e.preventDefault();var p=pos(e);sigCtx.beginPath();sigCtx.moveTo(last.x,last.y);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();last=p;sigHas=true;}
  function end(e){drawing=false;}
  sigCanvas.addEventListener("mousedown",start);sigCanvas.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  sigCanvas.addEventListener("touchstart",start,{passive:false});sigCanvas.addEventListener("touchmove",move,{passive:false});sigCanvas.addEventListener("touchend",end);
  document.getElementById("sigclr").onclick=function(){sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigHas=false;document.getElementById("sigph").style.display="grid";};
}

function val(id){var e=document.getElementById(id);return e?(e.value||"").trim():"";}
function chk(id){var e=document.getElementById(id);return !!(e&&e.checked);}

function submit(){
  var msg=document.getElementById("msg");
  function err(t){msg.innerHTML='<div class="msg err">'+esc(t)+'</div>';}
  if(val("f-nome").length<3) return err("Preencha seu nome completo.");
  if(!val("f-cpf")) return err("Preencha seu CPF.");
  if(!val("f-pix")) return err("Preencha sua chave Pix.");
  if(!chk("c-read")||!chk("c-agree")||!chk("c-adult")) return err("Marque as três confirmações para assinar.");
  if(!sigHas) return err("Faça sua assinatura no quadro.");
  if(val("f-signname").length<3) return err("Digite seu nome completo na assinatura.");
  var fields={
    nome_completo:val("f-nome"),nome_artistico:val("f-art"),nascimento:val("f-nasc"),
    nacionalidade:val("f-nac"),estado_civil:val("f-ec"),rg:val("f-rg"),cpf:val("f-cpf"),
    endereco:val("f-end"),cidade:val("f-cid"),email:val("f-email"),telefone:val("f-tel"),
    pix_key:val("f-pix"),pix_type:val("f-pixt"),canal:val("f-canal"),
    limites:{rosto:chk("l-rosto"),localizacao:chk("l-local"),outras_pessoas:chk("l-outros"),chamadas_video:chk("l-video"),outros:val("l-txt")}
  };
  var png="";try{png=sigCanvas.toDataURL("image/png");}catch(e){}
  var consent={read:chk("c-read"),agree:chk("c-agree"),adult:chk("c-adult")};
  var btn=document.getElementById("submit");btn.disabled=true;btn.textContent="Enviando…";msg.innerHTML="";
  api("sign",{fields:fields,consent:consent,signed_name:val("f-signname"),signature_png:png}).then(function(r){
    if(r&&r.ok){ showState("✅","Contrato assinado!","Pronto 💜 seu contrato foi enviado assinado para a Vezclub. Você pode fechar esta página."); return; }
    btn.disabled=false;btn.textContent="Assinar e enviar";
    if(r&&r.error==="already_signed") return err("Este contrato já foi assinado.");
    if(r&&r.error==="missing_consent") return err("Marque as três confirmações.");
    if(r&&r.error==="missing_signature") return err("Faça sua assinatura no quadro.");
    err("Não consegui enviar. Tente de novo.");
  });
}
