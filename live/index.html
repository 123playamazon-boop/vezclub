<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vezclub — Ao Vivo</title>
<style>
:root{--bg:#07060a;--card:#15131b;--line:#241f2e;--muted:#9a93a8;--tx:#f4f1f8;--ac:#1b74e8;--ac2:#1552b8;--live:#ff3b5c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.app{max-width:640px;margin:0 auto;height:100dvh;position:relative;background:#000}
video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:p 1.3s infinite}
@keyframes p{50%{opacity:.3}}
.x{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:4}
.center h2{margin:8px 0 6px}.center p{color:var(--muted);max-width:320px;line-height:1.5}
.center a,.btn{display:inline-block;margin-top:16px;padding:13px 22px;border-radius:13px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));text-decoration:none;border:0;cursor:pointer}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:5;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.ctrl{display:flex;gap:10px;justify-content:center}
.ctrl button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button.end{background:var(--live)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--ac);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <video id="remote" autoplay playsinline class="hide"></video>
  <video id="local" autoplay playsinline muted class="hide"></video>

  <div class="hud hide" id="hud">
    <span class="badge"><span class="dot"></span><span id="live-label">AO VIVO</span></span>
    <button class="x" id="close">✕</button>
  </div>

  <div class="center" id="center">
    <div class="spin" id="spin"></div>
    <h2 id="c-title" class="hide"></h2>
    <p id="c-msg"></p>
    <a id="c-link" class="hide">Ver perfil</a>
  </div>

  <div class="bottom hide" id="hostctrl">
    <div class="ctrl">
      <button id="cam">📷 Virar</button>
      <button id="mic">🎤 Mudo</button>
      <button id="end" class="end">Encerrar live</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SB_URL="https://mfxyavlpbofcdiylnnjm.supabase.co";
  var SB_KEY="sb_publishable_RZdvipvnj0yWXAzNcpSIVg_1axK7wmj";
  var FN=SB_URL+"/functions/v1/";
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  var LK=window.LivekitClient;
  var $=function(id){return document.getElementById(id);};
  function qs(k){try{return new URL(location.href).searchParams.get(k)||"";}catch(e){return"";}}
  function msg(title,text,linkHref,linkTxt){ $('spin').classList.add('hide'); if(title){$('c-title').textContent=title;$('c-title').classList.remove('hide');} $('c-msg').textContent=text||''; if(linkHref){$('c-link').href=linkHref;$('c-link').textContent=linkTxt||'Ver';$('c-link').classList.remove('hide');} $('center').classList.remove('hide'); }
  async function token(){ try{ var r=await sb.auth.getSession(); return r.data.session?r.data.session.access_token:null; }catch(e){ return null; } }

  var room=null, micOn=true, facing="user";
  async function start(){
    var creator=qs('c'); if(!creator){ msg('Sala inválida','Abra pelo perfil de uma modelo.'); return; }
    var tok=await token(); if(!tok){ msg('Entre primeiro','Você precisa estar logada(o).','/','Início'); return; }
    var r=await fetch(FN+'live_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify({creator_key:creator})});
    var j=await r.json().catch(function(){return{};});
    if(j.error==='livekit_not_configured'){ msg('Ao vivo em breve','O vídeo ao vivo está sendo ativado. Volte logo 💜','/m/?u='+encodeURIComponent(creator),'Ver perfil'); return; }
    if(j.error==='not_subscriber'){ msg('Assine pra assistir','O ao vivo é exclusivo pra assinantes.','/m/?u='+encodeURIComponent(creator),'Assinar'); return; }
    if(j.error||!j.token){ msg('Não consegui conectar','Tente de novo em instantes.'); return; }
    try{
      room=new LK.Room({ adaptiveStream:true, dynacast:true });
      room.on(LK.RoomEvent.TrackSubscribed,function(track){ if(track.kind==='video'){ track.attach($('remote')); $('remote').classList.remove('hide'); $('center').classList.add('hide'); } if(track.kind==='audio'){ track.attach(); } });
      room.on(LK.RoomEvent.Disconnected,function(){ if(j.role==='viewer') msg('Live encerrada','A transmissão terminou.','/m/?u='+encodeURIComponent(creator),'Ver perfil'); });
      room.on(LK.RoomEvent.ParticipantDisconnected,function(){ if(j.role==='viewer' && room.numParticipants<=1){ } });
      await room.connect(j.url, j.token);
      $('hud').classList.remove('hide');
      if(j.role==='host'){
        $('live-label').textContent='VOCÊ ESTÁ AO VIVO';
        await room.localParticipant.enableCameraAndMicrophone();
        var vt=room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
        if(vt&&vt.track){ vt.track.attach($('local')); $('local').classList.remove('hide'); }
        $('center').classList.add('hide'); $('hostctrl').classList.remove('hide');
      } else {
        $('live-label').textContent='AO VIVO';
        if(room.numParticipants<=1){ $('spin').classList.add('hide'); msg('Aguardando a modelo','Ela ainda não começou. Fique aqui que já já começa 💜'); }
      }
    }catch(e){ msg('Erro de conexão', String(e&&e.message||e)); }
  }

  $('close').onclick=$('end')&&($('end').onclick=async function(){ try{ if(room) await room.disconnect(); }catch(e){} var creator=qs('c'); location.href='/m/?u='+encodeURIComponent(creator); });
  $('close').onclick=async function(){ try{ if(room) await room.disconnect(); }catch(e){} history.length>1?history.back():location.href='/'; };
  $('mic').onclick=function(){ if(!room) return; micOn=!micOn; room.localParticipant.setMicrophoneEnabled(micOn); $('mic').textContent=micOn?'🎤 Mudo':'🔇 Ativar'; };
  $('cam').onclick=async function(){ if(!room) return; facing=facing==='user'?'environment':'user'; try{ await room.localParticipant.setCameraEnabled(false); await room.switchActiveDevice&&0; await room.localParticipant.setCameraEnabled(true,{facingMode:facing}); var vt=room.localParticipant.getTrackPublication(LK.Track.Source.Camera); if(vt&&vt.track){ vt.track.attach($('local')); } }catch(e){} };

  if(!LK){ msg('Indisponível','Não consegui carregar o player.'); } else start();
})();
</script>
<script>
(function(){
  try{
    if(new URL(location.href).searchParams.get("embed")!=="1") return;
    function closeParent(){ try{ if(window.parent && window.parent!==window && window.parent.__vezClosePanel){ window.parent.__vezClosePanel(); return true; } }catch(e){} return false; }
    document.addEventListener("click",function(e){
      var el=e.target.closest && e.target.closest("a,button"); if(!el) return;
      var href=el.getAttribute && el.getAttribute("href");
      var txt=(el.textContent||"").trim().toLowerCase();
      var isExit=(href && (href==="/" || href.indexOf("/m/")===0)) || txt==="voltar" || txt==="in\u00edcio" || txt==="inicio" || txt==="fechar" || txt==="sair" || txt==="ver perfil";
      if(isExit){ if(closeParent()){ e.preventDefault(); e.stopPropagation(); } }
    }, true);
  }catch(e){}
})();
</script>
</body>
</html>
