<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vezclub Admin</title>
<style>
:root{--bg:#0b0b0f;--card:#15131b;--card2:#1b1824;--line:#241f2e;--muted:#9a93a8;--tx:#f4f1f8;--ac:#c026d3;--ac2:#7c3aed;--ok:#2ecc71;--bad:#ff3b5c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px}.muted{color:var(--muted)}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e0c14;color:var(--tx);font-size:15px}
.btn{display:inline-block;padding:12px 18px;border:0;border-radius:11px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sec{background:var(--card2);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.docs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.docs a img{width:100%;border-radius:10px;border:1px solid var(--line)}
.kv{font-size:14px;margin:4px 0}.kv b{color:var(--muted);font-weight:600}
.hide{display:none}.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#2a2335;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Vezclub — Aprovação de produtoras</h2>

  <div id="gate" class="card hide">
    <p class="muted">Acesso restrito. Informe a chave de admin.</p>
    <input id="key" type="password" placeholder="chave de admin">
    <button class="btn" id="enter" style="margin-top:10px">Entrar</button>
  </div>

  <div id="main" class="hide">
    <div class="row" style="margin-bottom:10px">
      <div><span class="badge" id="count">—</span> <span class="muted">pendentes</span></div>
      <button class="btn sec" id="reload">Atualizar</button>
    </div>
    <div id="list"></div>
    <div id="empty" class="muted hide" style="text-align:center;padding:30px">Nenhuma produtora aguardando aprovação 🎉</div>
  </div>

  <div id="detail" class="hide"></div>
</div>

<script>
(function(){
  var SB_URL="https://mfxyavlpbofcdiylnnjm.supabase.co";
  var SB_KEY="sb_publishable_RZdvipvnj0yWXAzNcpSIVg_1axK7wmj";
  var FN=SB_URL+"/functions/v1/";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  var KEY='';
  try{ KEY=localStorage.getItem('vez_admin_key')||''; }catch(e){}
  async function api(action,extra){ var r=await fetch(FN+'admin_kyc',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify(Object.assign({k:KEY,action:action},extra||{}))}); return await r.json().catch(function(){return{error:'net'};}); }

  function show(id){ ['gate','main','detail'].forEach(function(p){ $(p).classList.toggle('hide', p!==id); }); }

  $('enter').onclick=function(){ KEY=$('key').value.trim(); try{localStorage.setItem('vez_admin_key',KEY);}catch(e){} start(); };
  $('reload').onclick=loadList;

  async function loadList(){
    var r=await api('list',{status:'submitted'});
    if(r.error==='forbidden'){ try{localStorage.removeItem('vez_admin_key');}catch(e){} KEY=''; show('gate'); return; }
    var items=(r.items)||[];
    $('count').textContent=items.length;
    $('empty').classList.toggle('hide', items.length>0);
    $('list').innerHTML=items.map(function(it){
      return '<div class="card"><div class="row"><div><div style="font-weight:700">'+esc(it.display_name||it.legal_name)+' <span class="muted">'+esc(it.handle||'')+'</span></div><div class="muted" style="font-size:13px">CPF '+esc(it.cpf)+' · '+esc(it.phone)+'</div></div><button class="btn" data-ck="'+esc(it.creator_key)+'">Revisar</button></div></div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('[data-ck]'),function(el){ el.onclick=function(){ openDetail(el.getAttribute('data-ck')); }; });
    show('main');
  }

  async function openDetail(ck){
    var r=await api('detail',{creator_key:ck});
    if(r.error){ alert('Erro ao abrir.'); return; }
    var k=r.kyc, d=r.docs||{};
    function img(u,lbl){ return u? '<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" alt="'+lbl+'"><div class="muted" style="font-size:11px;text-align:center">'+lbl+'</div></a>':'<div class="muted" style="font-size:12px">'+lbl+': —</div>'; }
    $('detail').innerHTML=
      '<div class="card">'+
        '<button class="btn sec" id="back" style="margin-bottom:12px">‹ Voltar</button>'+
        '<h2 style="margin:0 0 2px">'+esc(k.legal_name)+'</h2>'+
        '<div class="kv"><b>CPF:</b> '+esc(k.cpf)+'</div>'+
        '<div class="kv"><b>Nascimento:</b> '+esc(k.birth_date)+'</div>'+
        '<div class="kv"><b>Telefone:</b> '+esc(k.phone)+'</div>'+
        '<div class="kv"><b>Endereço:</b> '+esc(k.address)+'</div>'+
        '<div class="kv"><b>Termos aceitos em:</b> '+esc((k.tos_accepted_at||'').slice(0,19).replace("T"," "))+'</div>'+
        '<div class="docs">'+img(d.doc_front,'Frente')+img(d.doc_back,'Verso')+img(d.selfie,'Selfie')+'</div>'+
        '<label class="muted" style="font-size:13px">Motivo (se recusar)</label>'+
        '<textarea id="reason" rows="2" placeholder="ex: documento ilegível"></textarea>'+
        '<div class="row" style="margin-top:12px"><button class="btn bad" id="reject">Recusar</button><button class="btn ok" id="approve">Aprovar ✓</button></div>'+
      '</div>';
    $('back').onclick=loadList;
    $('approve').onclick=async function(){ this.disabled=true; var rr=await api('review',{creator_key:ck,approve:true}); if(rr.ok){ loadList(); } else { alert('Erro.'); this.disabled=false; } };
    $('reject').onclick=async function(){ var reason=$('reason').value.trim(); this.disabled=true; var rr=await api('review',{creator_key:ck,approve:false,reason:reason}); if(rr.ok){ loadList(); } else { alert('Erro.'); this.disabled=false; } };
    show('detail');
  }

  function start(){ if(!KEY){ show('gate'); return; } loadList(); }
  start();
})();
</script>
</body>
</html>
