<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vezclub Admin</title>
<style>
:root{--bg:#0b0b0f;--card:#15131b;--card2:#1b1824;--line:#241f2e;--muted:#9a93a8;--tx:#f4f1f8;--ac:#1b74e8;--ac2:#1552b8;--ok:#2ecc71;--bad:#ff3b5c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:20px;margin:0 0 2px}.muted{color:var(--muted)}
input,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#0e0c14;color:var(--tx);font-size:16px}
.btn{display:inline-block;padding:14px 18px;border:0;border-radius:12px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));font-size:15px}
.btn:disabled{opacity:.5}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.big{width:100%;padding:17px;font-size:17px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.docs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.docs a{display:block}.docs a img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.docs .lbl{font-size:11px;text-align:center;color:var(--muted);margin-top:3px}
.kv{font-size:15px;margin:7px 0;display:flex;gap:8px}.kv b{color:var(--muted);font-weight:600;min-width:92px;display:inline-block}
.hide{display:none}
.badge{font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;background:#2a2335;color:#fff}
.badge.n{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.title{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.av{width:48px;height:48px;border-radius:50%;background:#2a2335;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none}
.name{font-weight:800;font-size:18px}
.sig{font-size:13px;color:var(--ok);margin-top:6px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:11px 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:700;cursor:pointer;font-size:14px}
.tab.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.tab .c{display:inline-block;margin-left:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 7px;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .v{font-size:26px;font-weight:800}
.stat .l{font-size:13px;color:var(--muted);margin-top:2px}
.stat.hl{border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.stat.hl .v{color:var(--ac)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.pill.on{background:rgba(46,204,113,.16);color:var(--ok)}
.pill.off{background:rgba(255,59,92,.16);color:var(--bad)}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><div class="av">V</div><div><h1>Painel Vezclub</h1><div class="muted" style="font-size:13px">Admin da equipe</div></div></div>

  <div id="gate" class="card hide">
    <p class="muted">Acesso restrito à equipe. Informe a chave de admin.</p>
    <input id="key" type="password" placeholder="chave de admin">
    <button class="btn big" id="enter" style="margin-top:12px">Entrar</button>
  </div>

  <div id="main" class="hide">
    <div class="tabs">
      <div class="tab on" data-tab="geral">📊 Visão geral</div>
      <div class="tab" data-tab="clientes">👥 Clientes</div>
      <div class="tab" data-tab="financeiro">💰 Financeiro</div>
      <div class="tab" data-tab="conteudo">🖼️ Conteúdo</div>
      <div class="tab" data-tab="assinaturas">💳 Assinaturas</div>
      <div class="tab" data-tab="pendentes">🕒 Pendentes <span class="c" id="tc-pend">0</span></div>
      <div class="tab" data-tab="produtoras">👩 Produtoras <span class="c" id="tc-apr">0</span></div>
      <div class="tab" data-tab="encomendas">🎬 Encomendas <span class="c" id="tc-ord">0</span></div>
      <div style="margin-left:auto"><button class="btn sec" id="reload">↻ Atualizar</button></div>
    </div>

    <div id="pane-geral"></div>
    <div id="pane-clientes" class="hide"></div>
    <div id="pane-financeiro" class="hide"></div>
    <div id="pane-conteudo" class="hide"></div>
    <div id="pane-assinaturas" class="hide"></div>
    <div id="pane-pendentes" class="hide"></div>
    <div id="pane-produtoras" class="hide"></div>
    <div id="pane-encomendas" class="hide"></div>
  </div>
</div>

<script>
(function(){
  var SB_URL="https://mfxyavlpbofcdiylnnjm.supabase.co";
  var SB_KEY="sb_publishable_RZdvipvnj0yWXAzNcpSIVg_1axK7wmj";
  var FN=SB_URL+"/functions/v1/";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function brl(c){return "R$ "+((c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function initials(n){ n=String(n||'').trim(); return (n[0]||'?').toUpperCase(); }
  var KEY=''; try{ KEY=localStorage.getItem('vez_admin_key')||''; }catch(e){}
  // link direto pro time: /admin/#k=CHAVE — entra sozinho e limpa a chave da barra de endereço
  (function(){ try{ var m=/[#&?]k=([^&]+)/.exec(location.hash||'') || /[?&]k=([^&]+)/.exec(location.search||''); if(m&&m[1]){ KEY=decodeURIComponent(m[1]); try{localStorage.setItem('vez_admin_key',KEY);}catch(e){} try{history.replaceState(null,'',location.pathname);}catch(e){} } }catch(e){} })();
  async function api(action,extra){ var r=await fetch(FN+'admin_kyc',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify(Object.assign({k:KEY,action:action},extra||{}))}); return await r.json().catch(function(){return{error:'net'};}); }

  function showGate(){ $('gate').classList.remove('hide'); $('main').classList.add('hide'); }
  function showMain(){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); }

  $('enter').onclick=function(){ KEY=$('key').value.trim(); try{localStorage.setItem('vez_admin_key',KEY);}catch(e){} start(); };
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('enter').click(); });
  $('reload').onclick=function(){ loadAll(); };

  var current='geral';
  var PANES=['geral','clientes','financeiro','conteudo','assinaturas','pendentes','produtoras','encomendas'];
  function loaderFor(name){ return ({geral:loadOverview,clientes:loadClientes,financeiro:loadFinanceiro,conteudo:loadConteudo,assinaturas:loadAssinaturas,pendentes:loadPending,produtoras:loadProdutoras,encomendas:loadOrders})[name]; }
  function showTab(name){
    current=name;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x.getAttribute('data-tab')===name);});
    PANES.forEach(function(p){ $('pane-'+p).classList.toggle('hide',p!==name); });
    var fn=loaderFor(name); if(fn) fn();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.onclick=function(){ showTab(t.getAttribute('data-tab')); };
  });

  async function loadOverview(){
    var r=await api('overview');
    if(r.error==='forbidden'){ try{localStorage.removeItem('vez_admin_key');}catch(e){} KEY=''; showGate(); return false; }
    $('tc-pend').textContent=r.pending||0;
    $('tc-apr').textContent=r.approved||0;
    $('tc-ord').textContent=r.orders_pending||0;
    $('pane-geral').innerHTML=
      '<div class="stats">'+
      '<div class="stat hl"><div class="v">'+(r.pending||0)+'</div><div class="l">Aguardando aprovação</div></div>'+
      '<div class="stat"><div class="v">'+(r.users||0)+'</div><div class="l">Clientes</div></div>'+
      '<div class="stat"><div class="v" style="font-size:20px">'+brl(r.gmv_cents)+'</div><div class="l">Vendas BRL (total)</div></div>'+
      '<div class="stat"><div class="v">'+(r.subscribers||0)+'</div><div class="l">Assinantes ativos</div></div>'+
      '<div class="stat"><div class="v">'+(r.approved||0)+'</div><div class="l">Produtoras ativas</div></div>'+
      '<div class="stat"><div class="v">'+(r.ai||0)+'</div><div class="l">Modelos IA</div></div>'+
      '<div class="stat"><div class="v">'+(r.posts||0)+'</div><div class="l">Conteúdos publicados</div></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+
        '<button class="btn sec" data-go="clientes">👥 Ver clientes</button>'+
        '<button class="btn sec" data-go="financeiro">💰 Ver vendas</button>'+
        '<button class="btn sec" data-go="conteudo">🖼️ Moderar conteúdo</button>'+
        ((r.pending||0)>0?'<button class="btn" data-go="pendentes">🕒 Aprovar '+r.pending+' pendente(s)</button>':'')+
      '</div>';
    Array.prototype.forEach.call($('pane-geral').querySelectorAll('[data-go]'),function(bt){ bt.onclick=function(){ showTab(bt.getAttribute('data-go')); }; });
    return true;
  }

  async function loadPending(){
    var box=$('pane-pendentes');
    box.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('list',{status:'submitted'});
    if(r.error==='forbidden'){ showGate(); return; }
    var items=(r.items)||[];
    if(!items.length){ box.innerHTML='<div class="card muted" style="text-align:center;padding:40px 10px">Nenhuma produtora aguardando aprovação 🎉<br><span style="font-size:13px">Quando alguém se cadastrar, aparece aqui.</span></div>'; return; }
    box.innerHTML='';
    items.forEach(function(it){
      var el=document.createElement('div'); el.className='card';
      var nm=it.display_name||it.legal_name||'(sem nome)';
      el.innerHTML=
        '<div class="title" style="margin-bottom:10px"><div class="av">'+esc(initials(nm))+'</div>'+
          '<div><div class="name">'+esc(nm)+'</div><div class="muted" style="font-size:13px">'+esc(it.handle||'')+' · CPF '+esc(it.cpf||'—')+' · '+esc(it.phone||'—')+'</div></div></div>'+
        '<div class="docbox muted" style="font-size:13px">Carregando documentos…</div>'+
        '<div class="acts"><button class="btn bad">✕ Recusar</button><button class="btn ok">✓ Aprovar</button></div>';
      box.appendChild(el);
      var ck=it.creator_key;
      api('detail',{creator_key:ck}).then(function(d){
        if(d&&d.kyc){
          var k=d.kyc, dd=d.docs||{};
          function img(u,lbl){ return u? '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="'+lbl+'"><div class="lbl">'+lbl+'</div></a>':'<div class="muted lbl" style="padding:20px 0">'+lbl+': —</div>'; }
          var sig = k.tos_accepted_at ? '<div class="sig">✓ Contrato assinado em '+esc(String(k.tos_accepted_at).slice(0,19).replace("T"," "))+'</div>' : '';
          el.querySelector('.docbox').innerHTML=
            '<div class="docs">'+img(dd.doc_front,'Frente')+img(dd.doc_back,'Verso')+img(dd.selfie,'Selfie')+'</div>'+
            '<div class="kv"><b>Nome</b><span>'+esc(k.legal_name)+'</span></div>'+
            '<div class="kv"><b>Nascimento</b><span>'+esc(k.birth_date)+'</span></div>'+
            '<div class="kv"><b>Endereço</b><span>'+esc(k.address)+'</span></div>'+
            sig;
        } else { el.querySelector('.docbox').innerHTML='<span class="muted" style="font-size:13px">Não foi possível carregar os documentos.</span>'; }
      });
      var bad=el.querySelector('.btn.bad'), ok=el.querySelector('.btn.ok');
      ok.onclick=async function(){ if(!confirm('Aprovar '+nm+'? Ela poderá publicar e receber.')) return; ok.disabled=true;bad.disabled=true;ok.textContent='Aprovando…'; var rr=await api('review',{creator_key:ck,approve:true}); if(rr.ok){ el.style.opacity=.4; el.querySelector('.acts').innerHTML='<div style="grid-column:1/3;text-align:center;color:var(--ok);font-weight:800;padding:8px">✓ Aprovada</div>'; setTimeout(loadAll,900); } else { alert('Erro ao aprovar.'); ok.disabled=false;bad.disabled=false;ok.textContent='✓ Aprovar'; } };
      bad.onclick=async function(){ var reason=prompt('Motivo da recusa (opcional):','documento ilegível'); if(reason===null) return; ok.disabled=true;bad.disabled=true;bad.textContent='Recusando…'; var rr=await api('review',{creator_key:ck,approve:false,reason:reason||''}); if(rr.ok){ el.style.opacity=.4; el.querySelector('.acts').innerHTML='<div style="grid-column:1/3;text-align:center;color:var(--bad);font-weight:800;padding:8px">✕ Recusada</div>'; setTimeout(loadAll,900); } else { alert('Erro ao recusar.'); ok.disabled=false;bad.disabled=false;bad.textContent='✕ Recusar'; } };
    });
  }

  async function loadProdutoras(){
    var box=$('pane-produtoras');
    box.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('list',{status:'approved'});
    if(r.error==='forbidden'){ showGate(); return; }
    var items=(r.items)||[];
    if(!items.length){ box.innerHTML='<div class="card muted" style="text-align:center;padding:40px 10px">Nenhuma produtora aprovada ainda.</div>'; return; }
    var card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="card-head" style="margin-bottom:6px"><b>Produtoras aprovadas</b> <span class="muted">('+items.length+')</span></div>';
    items.forEach(function(it){
      var nm=it.display_name||it.legal_name||'(sem nome)';
      var row=document.createElement('div'); row.className='prow';
      row.innerHTML=
        '<div class="av" style="width:40px;height:40px;font-size:16px">'+esc(initials(nm))+'</div>'+
        '<div style="flex:1"><div style="font-weight:700">'+esc(nm)+'</div><div class="muted" style="font-size:13px">'+esc(it.handle||'')+'</div></div>'+
        '<span class="pill '+(it.approved?'on':'off')+'">'+(it.approved?'Ativa':'Pausada')+'</span>'+
        '<button class="btn sec" style="padding:9px 13px;font-size:13px">'+(it.approved?'Pausar':'Reativar')+'</button>';
      var btn=row.querySelector('button');
      btn.onclick=async function(){ var act=!it.approved; if(!confirm((act?'Reativar':'Pausar')+' '+nm+'?')) return; btn.disabled=true; var rr=await api('set_active',{creator_key:it.creator_key,active:act}); if(rr.ok){ loadAll(); } else { alert('Erro.'); btn.disabled=false; } };
      card.appendChild(row);
    });
    box.innerHTML=''; box.appendChild(card);
  }

  async function loadOrders(){
    var box=$('pane-encomendas');
    box.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('orders');
    if(r.error){ box.innerHTML='<div class="card muted" style="text-align:center;padding:30px">Não foi possível carregar.</div>'; return; }
    var rows=r.orders||[];
    if(!rows.length){ box.innerHTML='<div class="card muted" style="text-align:center;padding:40px 10px">Nenhuma encomenda ainda.</div>'; return; }
    var now=Date.now();
    var card=document.createElement('div'); card.className='card';
    var pend=rows.filter(function(o){return o.status==='paid';});
    var over=pend.filter(function(o){ var p=o.paid_at?new Date(o.paid_at).getTime():0; return p && now>p+72*3600*1000; });
    card.innerHTML='<div class="card-head" style="margin-bottom:8px"><b>Encomendas</b> <span class="muted">('+pend.length+' a entregar'+(over.length?' · '+over.length+' ATRASADA(s)':'')+')</span></div>';
    rows.forEach(function(o){
      var paid=o.paid_at?new Date(o.paid_at).getTime():0;
      var due=paid?paid+72*3600*1000:0;
      var overdue=o.status==='paid'&&due&&now>due;
      function fmt(ts){ if(!ts) return '—'; var d=new Date(ts); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
      var st=o.status==='delivered'?'<span style="color:var(--ok);font-weight:700">Entregue ✅</span>':(overdue?'<span style="color:var(--bad);font-weight:800">ATRASADO ⏰</span>':'<span style="color:var(--ac);font-weight:700">A entregar ⏳</span>');
      var flagged=o.flagged_at?' · <span class="muted">cobrada '+fmt(new Date(o.flagged_at).getTime())+'</span>':'';
      var brief=o.brief?('<div class="muted" style="font-size:12px;margin:5px 0;white-space:pre-wrap;border-left:2px solid #2a2335;padding-left:8px">'+esc(o.brief)+'</div>'):'';
      var el=document.createElement('div');
      el.style.cssText='border:1px solid '+(overdue?'var(--bad)':'#2a2335')+';border-radius:10px;padding:11px;margin-bottom:9px';
      var canFlag=o.status==='paid';
      el.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>'+esc(o.display_name||o.creator_key)+'</b> <span class="muted" style="font-size:12px">'+esc(o.handle||'')+'</span></div>'+st+'</div>'+
        '<div class="muted" style="font-size:12px;margin-top:3px">'+brl(o.amount_cents)+' · '+(o.kind||'')+' · pago '+fmt(paid)+(o.status==='paid'?(' · prazo '+fmt(due)):'' )+flagged+'</div>'+
        brief+
        (canFlag?'<button class="btn" data-flag="'+o.id+'" style="font-size:12px;padding:7px 12px;margin-top:5px;background:'+(o.flagged_at?'#2a2335':'')+'">'+(o.flagged_at?'Cobrar de novo':'⚠️ Cobrar entrega')+'</button>':'');
      card.appendChild(el);
    });
    box.innerHTML=''; box.appendChild(card);
    box.querySelectorAll('[data-flag]').forEach(function(b){ b.onclick=async function(){ if(!confirm('Cobrar a entrega dessa encomenda? A modelo vai ver o aviso no painel dela.')) return; b.disabled=true; b.textContent='Cobrando…'; var rr=await api('flag_order',{order_id:+b.getAttribute('data-flag')}); if(rr.ok){ loadOrders(); } else { alert('Erro.'); b.disabled=false; b.textContent='⚠️ Cobrar entrega'; } }; });
  }
  function money(cur,c){ c=c||0; if(String(cur).toUpperCase()==='USD') return '$ '+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return brl(c); }

  // ===== CLIENTES =====
  var _cliQ='', _cliOff=0;
  async function loadClientes(){
    var box=$('pane-clientes');
    box.innerHTML='<div class="card"><input id="cli-q" placeholder="Buscar por e-mail ou nome…" value="'+esc(_cliQ)+'"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="cli-search">Buscar</button><button class="btn sec" id="cli-clear">Limpar</button></div></div><div id="cli-list"><p class="muted" style="text-align:center;padding:20px">Carregando…</p></div>';
    $('cli-search').onclick=function(){ _cliQ=$('cli-q').value.trim(); _cliOff=0; cliFetch(); };
    $('cli-clear').onclick=function(){ _cliQ=''; _cliOff=0; $('cli-q').value=''; cliFetch(); };
    $('cli-q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ _cliQ=$('cli-q').value.trim(); _cliOff=0; cliFetch(); } });
    cliFetch();
  }
  async function cliFetch(){
    var list=$('cli-list'); if(!list) return;
    list.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('users',{q:_cliQ,offset:_cliOff});
    if(r.error==='forbidden'){ showGate(); return; }
    var items=r.items||[];
    if(!items.length){ list.innerHTML='<div class="card muted" style="text-align:center;padding:30px">Nenhum cliente encontrado.</div>'; return; }
    var card=document.createElement('div'); card.className='card';
    items.forEach(function(u){
      var nm=u.display_name||(u.email||'').split('@')[0]||'—';
      var when=u.created_at?String(u.created_at).slice(0,10).split('-').reverse().join('/'):'';
      var row=document.createElement('div'); row.className='prow';
      row.innerHTML='<div class="av" style="width:38px;height:38px;font-size:15px">'+esc(initials(nm))+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(nm)+(u.banned?' <span class="pill off">banido</span>':'')+'</div><div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(u.email||'')+'</div></div>'+
        '<div style="text-align:right;font-size:12px"><div><b>'+brl(u.spent_cents)+'</b></div><div class="muted">'+(u.coin_balance||0)+' coins · '+when+'</div></div>'+
        '<button class="btn '+(u.banned?'sec':'bad')+'" style="padding:8px 11px;font-size:12px">'+(u.banned?'Desbanir':'Banir')+'</button>';
      var btn=row.querySelector('button');
      btn.onclick=async function(){ var ban=!u.banned; if(!confirm((ban?'Banir':'Desbanir')+' '+(u.email||nm)+'?'+(ban?' Ele perde o acesso.':''))) return; btn.disabled=true; var rr=await api('user_ban',{user_id:u.id,ban:ban}); if(rr.ok){ cliFetch(); } else { alert('Erro ao atualizar.'); btn.disabled=false; } };
      card.appendChild(row);
    });
    list.innerHTML=''; list.appendChild(card);
    var nav=document.createElement('div'); nav.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:10px';
    nav.innerHTML='<button class="btn sec" '+(_cliOff<=0?'disabled':'')+' id="cli-prev" style="font-size:13px">← Anterior</button><span class="muted" style="font-size:12px">'+(_cliOff+1)+'–'+(_cliOff+items.length)+'</span><button class="btn sec" '+(items.length<50?'disabled':'')+' id="cli-next" style="font-size:13px">Próximo →</button>';
    list.appendChild(nav);
    if($('cli-prev')) $('cli-prev').onclick=function(){ _cliOff=Math.max(0,_cliOff-50); cliFetch(); };
    if($('cli-next')) $('cli-next').onclick=function(){ _cliOff+=50; cliFetch(); };
  }

  // ===== FINANCEIRO =====
  async function loadFinanceiro(){
    var box=$('pane-financeiro');
    box.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('finance');
    if(r.error==='forbidden'){ showGate(); return; }
    if(r.error){ box.innerHTML='<div class="card muted" style="text-align:center;padding:30px">Não foi possível carregar.</div>'; return; }
    var cur=r.by_currency||[], src=r.by_source||[], day=r.by_day||[], byC=r.by_creator||[], rec=r.recent||[], names=r.names||{};
    var srcLbl={coins:'Coins',sub:'Assinaturas',chat:'Chat (crédito)'};
    var h='';
    cur.forEach(function(c){
      h+='<div class="card"><div class="card-head" style="margin-bottom:8px"><b>Receita '+esc(c.currency)+'</b> <span class="muted">('+c.n+' vendas)</span></div>'+
        '<div class="stats"><div class="stat hl"><div class="v" style="font-size:20px">'+money(c.currency,c.cents)+'</div><div class="l">Total</div></div>'+
        '<div class="stat"><div class="v" style="font-size:17px">'+money(c.currency,c.today)+'</div><div class="l">Hoje</div></div>'+
        '<div class="stat"><div class="v" style="font-size:17px">'+money(c.currency,c.d7)+'</div><div class="l">7 dias</div></div>'+
        '<div class="stat"><div class="v" style="font-size:17px">'+money(c.currency,c.d30)+'</div><div class="l">30 dias</div></div></div></div>';
    });
    if(src.length){ h+='<div class="card"><div class="card-head" style="margin-bottom:6px"><b>Por tipo de venda</b></div>'+src.map(function(s){ return '<div class="prow"><div style="flex:1">'+esc(srcLbl[s.src]||s.src)+' <span class="muted">('+s.n+')</span></div><b>'+brl(s.cents)+'</b></div>'; }).join('')+'</div>'; }
    if(day.length){ var max=Math.max.apply(null,day.map(function(d){return d.cents;})); h+='<div class="card"><div class="card-head" style="margin-bottom:8px"><b>Últimos 14 dias</b></div>'+day.map(function(d){ var w=max?Math.round(d.cents/max*100):0; return '<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span class="muted" style="width:40px;font-size:11px">'+d.d.slice(5)+'</span><div style="flex:1;background:#0e0c14;border-radius:5px;height:15px"><div style="height:100%;width:'+w+'%;'+(d.cents?'min-width:3px;':'')+'background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:5px"></div></div><span style="width:74px;text-align:right;font-size:11px">'+brl(d.cents)+'</span></div>'; }).join('')+'</div>'; }
    if(byC.length){ h+='<div class="card"><div class="card-head" style="margin-bottom:6px"><b>Receita por criadora</b></div>'+byC.map(function(c){ var nm=names[c.creator_key]?names[c.creator_key].name:c.creator_key; return '<div class="prow"><div style="flex:1">'+esc(nm)+' <span class="muted">('+c.n+')</span></div><b>'+brl(c.cents)+'</b></div>'; }).join('')+'</div>'; }
    if(rec.length){ h+='<div class="card"><div class="card-head" style="margin-bottom:6px"><b>Transações recentes</b></div>'+rec.map(function(t){ var nm=t.creator_key&&names[t.creator_key]?names[t.creator_key].name:(t.creator_key||''); var when=t.paid_at?String(t.paid_at).slice(0,16).replace('T',' '):''; return '<div class="prow"><div style="flex:1;min-width:0"><div style="font-size:13px">'+esc(srcLbl[t.src]||t.src)+(nm?(' · '+esc(nm)):'')+'</div><div class="muted" style="font-size:11px">'+when+'</div></div><b>'+money(t.currency,t.amount_cents)+'</b></div>'; }).join('')+'</div>'; }
    box.innerHTML=h||'<div class="card muted" style="text-align:center;padding:30px">Sem vendas ainda.</div>';
  }

  // ===== CONTEÚDO =====
  var _conStatus='all';
  async function loadConteudo(){
    var box=$('pane-conteudo');
    var filt=[['all','Todos'],['approved','No ar'],['pending','Em análise'],['rejected','Recusados']];
    box.innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'+filt.map(function(f){ return '<button class="btn '+(_conStatus===f[0]?'':'sec')+'" data-cs="'+f[0]+'" style="padding:9px 13px;font-size:13px">'+f[1]+'</button>'; }).join('')+'</div><div id="con-list"><p class="muted" style="text-align:center;padding:20px">Carregando…</p></div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-cs]'),function(b){ b.onclick=function(){ _conStatus=b.getAttribute('data-cs'); loadConteudo(); }; });
    var r=await api('content',{status:_conStatus});
    if(r.error==='forbidden'){ showGate(); return; }
    var items=r.items||[]; var list=$('con-list'); if(!list) return;
    if(!items.length){ list.innerHTML='<div class="card muted" style="text-align:center;padding:30px">Nenhum conteúdo aqui.</div>'; return; }
    list.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px"></div>';
    var grid=list.firstChild;
    items.forEach(function(p){
      var stPill=p.status==='approved'?'<span class="pill on">No ar</span>':p.status==='rejected'?'<span class="pill off">Recusado</span>':'<span class="pill" style="background:#3a2f12;color:#ffcf6b">Análise</span>';
      var media=p.media_type==='video'?('<video src="'+esc(p.url||'')+'" style="width:100%;height:150px;object-fit:cover;border-radius:10px;background:#000" muted playsinline></video>'):('<img src="'+esc(p.url||'')+'" style="width:100%;height:150px;object-fit:cover;border-radius:10px;background:#1b1824">');
      var el=document.createElement('div'); el.className='card'; el.style.padding='8px';
      el.innerHTML=media+'<div style="font-size:12px;margin:6px 0 2px;display:flex;justify-content:space-between;align-items:center">'+stPill+'<span class="muted">'+(p.is_free?'grátis':brl(p.price_cents))+'</span></div>'+
        '<div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.creator_name||'')+'</div>'+
        '<div style="display:flex;gap:5px;margin-top:6px">'+(p.status!=='approved'?'<button class="btn ok" data-m="approve" style="flex:1;padding:7px;font-size:13px">✓</button>':'')+(p.status!=='rejected'?'<button class="btn" data-m="reject" style="flex:1;padding:7px;font-size:13px;background:#3a2f12;color:#ffcf6b">⚠</button>':'')+'<button class="btn bad" data-m="delete" style="flex:1;padding:7px;font-size:13px">🗑</button></div>';
      Array.prototype.forEach.call(el.querySelectorAll('[data-m]'),function(bt){ bt.onclick=async function(){ var op=bt.getAttribute('data-m'); if(op==='delete'&&!confirm('Remover esse conteúdo de vez?')) return; bt.disabled=true; var rr=await api('content_moderate',{id:p.id,op:op}); if(rr.ok){ loadConteudo(); } else { alert('Erro.'); bt.disabled=false; } }; });
      grid.appendChild(el);
    });
  }

  // ===== ASSINATURAS =====
  async function loadAssinaturas(){
    var box=$('pane-assinaturas');
    box.innerHTML='<p class="muted" style="text-align:center;padding:20px">Carregando…</p>';
    var r=await api('subs');
    if(r.error==='forbidden'){ showGate(); return; }
    var act=r.active||[], hist=r.history||[];
    var h='<div class="card"><div class="card-head" style="margin-bottom:6px"><b>Assinaturas ativas</b> <span class="muted">('+act.length+')</span></div>';
    if(!act.length){ h+='<p class="muted" style="font-size:13px">Nenhuma assinatura ativa.</p>'; }
    else act.forEach(function(s){ var exp=s.expires_at?String(s.expires_at).slice(0,10).split('-').reverse().join('/'):''; h+='<div class="prow"><div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(s.creator_name||s.creator_key)+'</div><div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(s.email||s.buyer_id||'')+'</div></div><div style="text-align:right;font-size:12px"><div>'+(s.auto_renew===false?'<span style="color:var(--bad)">cancelada</span>':'<span style="color:var(--ok)">renova</span>')+'</div><div class="muted">até '+exp+'</div></div></div>'; });
    h+='</div><div class="card"><div class="card-head" style="margin-bottom:6px"><b>Compras de assinatura</b> <span class="muted">('+hist.length+')</span></div>';
    if(!hist.length){ h+='<p class="muted" style="font-size:13px">Nenhuma ainda.</p>'; }
    else hist.forEach(function(s){ var when=s.paid_at?String(s.paid_at).slice(0,10).split('-').reverse().join('/'):''; h+='<div class="prow"><div style="flex:1">'+esc(s.creator_name||s.creator_key)+' <span class="muted" style="font-size:12px">· '+(s.days||'')+'d</span></div><div style="text-align:right"><b>'+money(s.currency||'BRL',s.amount_cents)+'</b><div class="muted" style="font-size:11px">'+when+'</div></div></div>'; });
    h+='</div>';
    box.innerHTML=h;
  }

  async function loadAll(){ var ok=await loadOverview(); if(ok===false) return; var fn=loaderFor(current); if(fn&&current!=='geral') fn(); }
  function start(){ if(!KEY){ showGate(); return; } showMain(); loadOverview(); }
  start();
})();
</script>
