<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vezclub — Chamada privada</title>
<style>
:root{--bg:#07060a;--muted:#9a93a8;--tx:#f4f1f8;--ac:#c026d3;--ac2:#7c3aed;--live:#ff3b5c;--line:#241f2e}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.app{max-width:640px;margin:0 auto;height:100dvh;position:relative;background:#000;overflow:hidden}
#remote{width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;right:12px;top:12px;width:34%;max-width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:#111;z-index:6}
.hud{position:absolute;top:14px;left:14px;z-index:7}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:p 1.3s infinite}
@keyframes p{50%{opacity:.3}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5}
.center h2{margin:14px 0 6px}.center p{color:var(--muted);max-width:320px;line-height:1.5}
.center a,.btn{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:13px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));text-decoration:none;border:0;cursor:pointer}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--ac);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.pulse{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:40px;animation:rings 1.6s infinite}
@keyframes rings{0%{box-shadow:0 0 0 0 rgba(192,38,211,.5)}100%{box-shadow:0 0 0 28px rgba(192,38,211,0)}}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:12px;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.bottom button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:13px 16px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.bottom button.end{background:var(--live)}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <video id="remote" autoplay playsinline class="hide"></video>
  <video id="local" autoplay playsinline muted class="hide"></video>
  <div class="hud hide" id="hud"><span class="badge"><span class="dot"></span> CHAMADA PRIVADA</span><span class="badge" id="coins-badge" style="margin-left:8px">🪙 <span id="coins-left">—</span></span></div>

  <div class="center" id="center">
    <div class="pulse" id="pulse">📞</div>
    <div class="spin hide" id="spin"></div>
    <h2 id="title">Conectando…</h2>
    <p id="msg"></p>
    <a id="link" class="hide"></a>
  </div>

  <div class="bottom hide" id="ctrl">
    <button id="mic">🎤 Mudo</button>
    <button id="cam">📷 Virar</button>
    <button id="end" class="end">Encerrar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SB_URL="https://mfxyavlpbofcdiylnnjm.supabase.co";
  var SB_KEY="sb_publishable_RZdvipvnj0yWXAzNcpSIVg_1axK7wmj";
  var FN=SB_URL+"/functions/v1/";
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  var LK=window.LivekitClient;
  var $=function(id){return document.getElementById(id);};
  function qs(k){try{return new URL(location.href).searchParams.get(k)||"";}catch(e){return"";}}
  function center(title,text,linkHref,linkTxt,showPulse){ $('center').classList.remove('hide'); $('pulse').classList.toggle('hide',!showPulse); $('spin').classList.toggle('hide',showPulse); $('title').textContent=title||''; $('msg').textContent=text||''; if(linkHref){$('link').href=linkHref;$('link').textContent=linkTxt||'Voltar';$('link').classList.remove('hide');} else $('link').classList.add('hide'); }
  async function token(){ try{ var r=await sb.auth.getSession(); return r.data.session?r.data.session.access_token:null; }catch(e){ return null; } }
  async function api(action,extra){ var tok=await token(); if(!tok) return {error:'auth'}; var r=await fetch(FN+'call',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify(Object.assign({action:action},extra||{}))}); return await r.json().catch(function(){return{error:'net'};}); }

  var room=null, micOn=true, facing="user", poll=null, callId=qs('id'), tickTimer=null;
  async function doTick(){ var r=await api('tick',{call_id:callId}); if(r && r.ended){ if(tickTimer){clearInterval(tickTimer);tickTimer=null;} endUi('Os coins acabaram'); } else if(r && r.balance!=null){ $('coins-left').textContent=r.balance; } }
  function startTick(){ doTick(); if(tickTimer) clearInterval(tickTimer); tickTimer=setInterval(doTick, 20000); }
  async function join(res){
    if(poll){ clearInterval(poll); poll=null; }
    try{
      room=new LK.Room({adaptiveStream:true,dynacast:true});
      room.on(LK.RoomEvent.TrackSubscribed,function(track){ if(track.kind==='video'){ track.attach($('remote')); $('remote').classList.remove('hide'); $('center').classList.add('hide'); } if(track.kind==='audio'){ track.attach(); } });
      room.on(LK.RoomEvent.Disconnected,function(){ endUi('Chamada encerrada'); });
      room.on(LK.RoomEvent.ParticipantDisconnected,function(){ endUi('A outra pessoa saiu'); });
      await room.connect(res.url, res.token);
      await room.localParticipant.enableCameraAndMicrophone();
      var vt=room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
      if(vt&&vt.track){ vt.track.attach($('local')); $('local').classList.remove('hide'); }
      $('hud').classList.remove('hide'); $('ctrl').classList.remove('hide');
      startTick();
      if(room.numParticipants<=1){ center('Conectado','Esperando a outra pessoa entrar…',null,null,false); } else { $('center').classList.add('hide'); }
    }catch(e){ center('Erro de conexão', String(e&&e.message||e), '/', 'Início', false); }
  }
  async function endUi(t){ if(tickTimer){clearInterval(tickTimer);tickTimer=null;} try{ if(room) await room.disconnect(); }catch(e){} await api('end',{call_id:callId}); center(t||'Chamada encerrada','Obrigado 💜','/', 'Início', false); $('ctrl').classList.add('hide'); $('local').classList.add('hide'); $('remote').classList.add('hide'); }

  $('end').onclick=function(){ endUi('Você encerrou'); };
  $('mic').onclick=function(){ if(!room)return; micOn=!micOn; room.localParticipant.setMicrophoneEnabled(micOn); $('mic').textContent=micOn?'🎤 Mudo':'🔇 Ativar'; };
  $('cam').onclick=async function(){ if(!room)return; facing=facing==='user'?'environment':'user'; try{ await room.localParticipant.setCameraEnabled(true,{facingMode:facing}); var vt=room.localParticipant.getTrackPublication(LK.Track.Source.Camera); if(vt&&vt.track) vt.track.attach($('local')); }catch(e){} };

  async function start(){
    if(!LK){ center('Indisponível','Não consegui carregar o vídeo.'); return; }
    if(!callId){ center('Chamada inválida','Abra pela conversa ou pelo perfil.','/', 'Início', false); return; }
    var tok=await token(); if(!tok){ center('Entre primeiro','Você precisa estar logada(o).','/', 'Início', false); return; }
    // tenta como modelo (accept); se não for dona, cai pro fluxo de assinante
    var a=await api('accept',{call_id:callId});
    if(a.ok && a.token){ center('Conectando…','',null,null,true); join(a); return; }
    // assinante: aguarda a modelo aceitar
    center('Chamando…','Aguarde a modelo aceitar a chamada 💜',null,null,true);
    poll=setInterval(async function(){
      var s=await api('status',{call_id:callId});
      if(s.status==='active' && s.token){ clearInterval(poll); poll=null; center('Conectando…','',null,null,true); join(s); }
      else if(s.status==='declined'){ clearInterval(poll); poll=null; center('Chamada recusada','Ela não pôde atender agora.','/', 'Voltar', false); }
      else if(s.status==='ended'){ clearInterval(poll); poll=null; center('Chamada encerrada','','/', 'Voltar', false); }
    }, 2500);
  }
  start();
})();
</script>
<script>
(function(){
  try{
    if(new URL(location.href).searchParams.get("embed")!=="1") return;
    function closeParent(){ try{ if(window.parent && window.parent!==window && window.parent.__vezClosePanel){ window.parent.__vezClosePanel(); return true; } }catch(e){} return false; }
    document.addEventListener("click",function(e){
      var el=e.target.closest && e.target.closest("a,button"); if(!el) return;
      var href=el.getAttribute && el.getAttribute("href");
      var txt=(el.textContent||"").trim().toLowerCase();
      var isExit=(href && (href==="/" || href.indexOf("/m/")===0)) || txt==="voltar" || txt==="in\u00edcio" || txt==="inicio" || txt==="fechar" || txt==="sair";
      if(isExit){ if(closeParent()){ e.preventDefault(); e.stopPropagation(); } }
    }, true);
  }catch(e){}
})();
</script>
</body>
</html>
